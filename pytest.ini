[pytest]
# Pytest configuration for BART Meta-Regression

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests

# Minimum version
minversion = 7.0

# Test paths
testpaths = .

# Coverage options (if using pytest-cov)
# Uncomment these if you install pytest-cov
# addopts = --cov=bart_meta_regression --cov-report=html --cov-report=term

# Output options
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pymc
    ignore::FutureWarning:pymc_bart
